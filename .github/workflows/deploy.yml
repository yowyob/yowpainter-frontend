# La forge construit, l'agent deploie — plus de session SSH depuis la forge.
name: Deploy (server)
on:
  workflow_run:
    workflows: ["Publish Docker image (GHCR)"]
    types: [completed]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'yowyob/yowpainter-frontend' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    env:
      AGENT: https://kernel-core.yowyob.com/_agent
      SERVICE: yowpainter-frontend
    steps:
      - name: Demander le deploiement a l agent
        env:
          AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
        run: |
          set -euo pipefail
          reponse=$(curl -sS --fail-with-body --max-time 60 -X POST -H "Authorization: Bearer $AGENT_TOKEN" "$AGENT/deploy/$SERVICE")
          echo "$reponse"
          echo "$reponse" | grep -q '"accepted": *true'

      - name: Verifier l issue reelle du deploiement
        env:
          AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
        run: |
          set -euo pipefail
          # Verifier que le service repond ne suffit PAS : l'ANCIENNE version repond aussi bien.
          for tentative in $(seq 1 40); do
            etat=$(curl -sS --max-time 20 -H "Authorization: Bearer $AGENT_TOKEN" "$AGENT/deployments" | jq -r --arg s "$SERVICE" '[.[] | select(.service == $s)] | .[0].status // "aucun"')
            if [ "$etat" = "success" ]; then echo "Deploiement confirme par l agent."; exit 0; fi
            if [ "$etat" = "failed" ] || [ "$etat" = "error" ]; then echo "L agent signale un echec." >&2; exit 1; fi
            echo "tentative $tentative : $etat"
            sleep 15
          done
          echo "Aucune issue apres attente." >&2
          exit 1

      - name: Verifier que le service repond
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 https://painter.yowyob.com/ || echo 000)
          echo "https://painter.yowyob.com/ repond $code"
          [ "$code" = "200" ]
